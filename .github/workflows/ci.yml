name: PROMO GEST CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend install, checks, and static hosting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript strict check
        run: npm run lint
      - name: Frontend unit tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Verify frontend production output
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/local-web/dist/index.html
          if ! find apps/local-web/dist -type f \( -name '*.js' -o -name '*.css' \) -print -quit | grep -q .; then
            echo "Missing frontend JavaScript/CSS assets" >&2
            exit 1
          fi
          if grep -R -n -E 'dev-api-middleware|createPromoGestDevApiPlugin|ViteDevContractPreview' apps/local-web/dist; then
            echo "Development preview code leaked into production frontend." >&2
            exit 1
          fi
      - name: Build frontend into ASP.NET Core wwwroot
        run: npm run build:aspnetcore
      - name: Verify ASP.NET Core static hosting output
        shell: bash
        run: |
          set -euo pipefail
          test -s src/PromoGest.Api/wwwroot/index.html
          if ! find src/PromoGest.Api/wwwroot -type f \( -name '*.js' -o -name '*.css' \) -print -quit | grep -q .; then
            echo "Missing wwwroot JavaScript/CSS assets" >&2
            exit 1
          fi
          if grep -R -n -E 'dev-api-middleware|createPromoGestDevApiPlugin|ViteDevContractPreview' src/PromoGest.Api/wwwroot; then
            echo "Development preview code leaked into ASP.NET Core wwwroot." >&2
            exit 1
          fi

  backend-and-postgres:
    name: .NET 10 and PostgreSQL 18 least-privilege tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore solution
        run: dotnet restore src/PromoGest.sln
      - name: Build solution with warnings as errors
        run: dotnet build src/PromoGest.sln --configuration Release --no-restore
      - name: Publish Linux runtime artifact
        run: dotnet publish src/PromoGest.Api/PromoGest.Api.csproj --configuration Release --runtime linux-x64 --self-contained true --output artifacts/linux-x64
      - name: Validate Linux shell scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            bash -n "$script"
          done
          if grep -nF '\${' scripts/*.sh; then
            echo "Escaped Bash parameter expansion found in a shell script." >&2
            exit 1
          fi
      - name: Domain tests
        run: dotnet test tests/PromoGest.Domain.Tests/PromoGest.Domain.Tests.csproj --configuration Release --no-build
      - name: Application tests
        run: dotnet test tests/PromoGest.Application.Tests/PromoGest.Application.Tests.csproj --configuration Release --no-build
      - name: Provision PostgreSQL identities and initial database
        env:
          PGPASSWORD: postgres_password
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE promogest_owner WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT PASSWORD 'owner_pass';
          CREATE ROLE promogest_app WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT PASSWORD 'app_pass';
          CREATE DATABASE promogest_ci OWNER promogest_owner;
          GRANT CONNECT ON DATABASE promogest_ci TO promogest_app;
          SQL
      - name: Apply migrations and seed roles as migration owner
        env:
          PROMOGEST_MIGRATE_DB_CONNECTION: Host=localhost;Port=5432;Database=promogest_ci;Username=promogest_owner;Password=owner_pass
        run: dotnet run --project src/PromoGest.Api/PromoGest.Api.csproj --configuration Release --no-build -- --migrate
      - name: Run integration tests with separate database identities
        env:
          PROMOGEST_TEST_PROVISION_DB_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres_password
          PROMOGEST_TEST_MIGRATE_DB_CONNECTION: Host=localhost;Port=5432;Database=promogest_ci;Username=promogest_owner;Password=owner_pass
          PROMOGEST_TEST_DB_CONNECTION: Host=localhost;Port=5432;Database=promogest_ci;Username=promogest_app;Password=app_pass
        run: dotnet test tests/PromoGest.IntegrationTests/PromoGest.IntegrationTests.csproj --configuration Release --no-build
      - name: Run full database, storage, and Data Protection restore drill
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: promogest_owner
          PGPROVISION_USER: postgres
          PROMOGEST_APP_USER: promogest_app
          PROMOGEST_DATA_PROTECTION_CERT_PASSWORD: Restore-CI-Pfx-Password-2026
          PGPASSFILE: ${{ runner.temp }}/promogest.pgpass
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'localhost:5432:*:postgres:postgres_password' \
            'localhost:5432:*:promogest_owner:owner_pass' \
            'localhost:5432:*:promogest_app:app_pass' > "$PGPASSFILE"
          chmod 600 "$PGPASSFILE"

          storage_root="$RUNNER_TEMP/promogest-storage"
          key_root="$RUNNER_TEMP/promogest-dpkeys"
          config_path="$RUNNER_TEMP/promogest-appsettings.json"
          mkdir -p "$storage_root/organization/2026/11" "$key_root"
          printf 'PROMO GEST restore verification file\n' > "$storage_root/organization/2026/11/restore-probe.bin"
          printf '<key id="ci-restore-probe">test-only-key-material</key>\n' > "$key_root/key-ci-probe.xml"
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$RUNNER_TEMP/promogest-dp.key" \
            -out "$RUNNER_TEMP/promogest-dp.crt" \
            -days 2 -subj "/CN=PromoGest CI Data Protection"
          openssl pkcs12 -export -out "$key_root/protection.pfx" \
            -inkey "$RUNNER_TEMP/promogest-dp.key" \
            -in "$RUNNER_TEMP/promogest-dp.crt" \
            -passout env:PROMOGEST_DATA_PROTECTION_CERT_PASSWORD
          rm -f "$RUNNER_TEMP/promogest-dp.key" "$RUNNER_TEMP/promogest-dp.crt"
          printf '%s\n' '{"ConnectionStrings":{"DefaultConnection":"Host=localhost;Port=5432;Database=promogest_ci;Username=promogest_app;Password=app_pass"}}' > "$config_path"

          probe_file="$storage_root/organization/2026/11/restore-probe.bin"
          probe_hash="$(sha256sum "$probe_file" | awk '{print $1}')"
          probe_size="$(stat -c '%s' "$probe_file")"

          psql --host="$PGHOST" --port="$PGPORT" --username="$PGUSER" --dbname=promogest_ci \
            --set=ON_ERROR_STOP=1 --set=probe_hash="$probe_hash" --set=probe_size="$probe_size" <<'SQL'
          WITH probe_user AS (
              INSERT INTO users (
                  id, username, normalized_username, full_name, email, normalized_email, phone,
                  password_hash, is_system_administrator, is_active, preferred_language,
                  failed_login_attempts, lockout_end_utc, last_login_at_utc, security_stamp,
                  created_at_utc, updated_at_utc, concurrency_stamp
              )
              VALUES (
                  gen_random_uuid(), 'backup.restore.probe', 'BACKUP.RESTORE.PROBE',
                  'Backup Restore Probe', 'backup-restore-probe@example.invalid',
                  'BACKUP-RESTORE-PROBE@EXAMPLE.INVALID', NULL, 'test-only-password-hash',
                  FALSE, TRUE, 'ar', 0, NULL, NULL, gen_random_uuid(), now(), now(), gen_random_uuid()
              )
              RETURNING id
          )
          INSERT INTO stored_files (
              id, original_file_name, stored_relative_path, content_type, size_bytes,
              sha256_checksum, scope, project_id, uploaded_by_user_id,
              created_at_utc, updated_at_utc, concurrency_stamp
          )
          SELECT gen_random_uuid(), 'restore-probe.bin', 'organization/2026/11/restore-probe.bin',
                 'application/octet-stream', :'probe_size'::bigint, :'probe_hash',
                 'Organization', NULL, probe_user.id, now(), now(), gen_random_uuid()
          FROM probe_user;
          SQL

          echo "[Linux backup script] Creating a real protected backup bundle as root..."
          sudo install -d -o root -g root -m 0750 /etc/promogest
          sudo install -o root -g root -m 0600 "$PGPASSFILE" /etc/promogest/pgpass
          backup_root="$RUNNER_TEMP/promogest-backups"
          sudo env \
            PGHOST="$PGHOST" PGPORT="$PGPORT" PGUSER="$PGUSER" \
            PGPASSFILE=/etc/promogest/pgpass \
            PROMOGEST_DB_NAME=promogest_ci \
            PROMOGEST_STORAGE_DIR="$storage_root" \
            PROMOGEST_DATA_PROTECTION_KEY_DIR="$key_root" \
            PROMOGEST_CONFIG_PATH="$config_path" \
            PROMOGEST_CADDYFILE_PATH="$GITHUB_WORKSPACE/deploy/linux/Caddyfile" \
            PROMOGEST_BACKUP_ROOT="$backup_root" \
            PROMOGEST_DATA_PROTECTION_CERT_PASSWORD="$PROMOGEST_DATA_PROTECTION_CERT_PASSWORD" \
            bash scripts/backup-promogest.sh
          bundle_dir="$(sudo find "$backup_root" -mindepth 1 -maxdepth 1 -type d -name 'promogest_backup_*' -print -quit)"
          test -n "$bundle_dir"
          for component in database.dump storage.tar.gz dataprotection-keys.tar.gz config-sanitized.tar.gz manifest.sha256; do
            sudo test -s "$bundle_dir/$component"
          done
          sudo bash -c 'cd "$1" && sha256sum -c manifest.sha256' _ "$bundle_dir"
          bash scripts/verify-backup-restore.sh promogest_ci "$storage_root" "$config_path" "$key_root"

  windows-publish-and-powershell:
    name: Windows publish and PowerShell validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore solution
        run: dotnet restore src/PromoGest.sln
      - name: Build solution
        run: dotnet build src/PromoGest.sln --configuration Release --no-restore
      - name: Verify Windows machine-scoped Data Protection key-ring recovery
        run: dotnet test tests/PromoGest.IntegrationTests/PromoGest.IntegrationTests.csproj --configuration Release --no-build --filter FullyQualifiedName~WindowsDpapiMachineScopeTests
      - name: Publish Windows x64 application
        run: dotnet publish src/PromoGest.Api/PromoGest.Api.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/win-x64
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path scripts, deploy -Recurse -Filter *.ps1
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($file.FullName): $($_.Message)" }
              exit 1
            }
            Write-Host "Validated syntax: $($file.FullName)"
          }
