name: PROMO GEST CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend install, checks, and static hosting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript strict check
        run: npm run lint
      - name: Frontend unit tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Verify frontend production output
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/local-web/dist/index.html
          if ! find apps/local-web/dist -type f \( -name '*.js' -o -name '*.css' \) -print -quit | grep -q .; then
            echo "Missing frontend JavaScript/CSS assets" >&2
            exit 1
          fi
          if grep -R -n -E 'dev-api-middleware|createPromoGestDevApiPlugin|ViteDevContractPreview' apps/local-web/dist; then
            echo "Development preview code leaked into production frontend." >&2
            exit 1
          fi
      - name: Build frontend into ASP.NET Core wwwroot
        run: npm run build:aspnetcore
      - name: Verify ASP.NET Core static hosting output
        shell: bash
        run: |
          set -euo pipefail
          test -s src/PromoGest.Api/wwwroot/index.html
          if ! find src/PromoGest.Api/wwwroot -type f \( -name '*.js' -o -name '*.css' \) -print -quit | grep -q .; then
            echo "Missing wwwroot JavaScript/CSS assets" >&2
            exit 1
          fi
          if grep -R -n -E 'dev-api-middleware|createPromoGestDevApiPlugin|ViteDevContractPreview' src/PromoGest.Api/wwwroot; then
            echo "Development preview code leaked into ASP.NET Core wwwroot." >&2
            exit 1
          fi
      - name: Upload verified production SPA assets
        uses: actions/upload-artifact@v7
        with:
          name: promogest-wwwroot
          path: src/PromoGest.Api/wwwroot/
          if-no-files-found: error
          retention-days: 1

  backend-and-postgres:
    name: .NET 10 and PostgreSQL 18 least-privilege tests
    needs: frontend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: promogest-wwwroot
          path: src/PromoGest.Api/wwwroot
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Restore solution
        run: dotnet restore src/PromoGest.sln
      - name: Build solution with warnings as errors
        run: dotnet build src/PromoGest.sln --configuration Release --no-restore
      - name: Publish Linux runtime artifact
        run: dotnet publish src/PromoGest.Api/PromoGest.Api.csproj --configuration Release --runtime linux-x64 --self-contained true --output artifacts/linux-x64
      - name: Verify Linux published executable
        shell: bash
        run: |
          set -euo pipefail
          test -x artifacts/linux-x64/PromoGest.Api
          test -s artifacts/linux-x64/PromoGest.Api.dll
      - name: Validate Linux shell scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            bash -n "$script"
          done
          if grep -nF '\${' scripts/*.sh; then
            echo "Escaped Bash parameter expansion found in a shell script." >&2
            exit 1
          fi
      - name: Domain tests
        run: dotnet test tests/PromoGest.Domain.Tests/PromoGest.Domain.Tests.csproj --configuration Release --no-build
      - name: Application tests
        run: dotnet test tests/PromoGest.Application.Tests/PromoGest.Application.Tests.csproj --configuration Release --no-build
      - name: Provision PostgreSQL identities and initial database
        env:
          PGPASSWORD: postgres_password
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE promogest_owner WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT PASSWORD 'owner_pass';
          CREATE ROLE promogest_app WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT PASSWORD 'app_pass';
          CREATE DATABASE promogest_ci OWNER promogest_owner;
          GRANT CONNECT ON DATABASE promogest_ci TO promogest_app;
          SQL
      - name: Apply migrations and seed roles as migration owner
        env:
          PROMOGEST_MIGRATE_DB_CONNECTION: Host=localhost;Port=5432;Database=promogest_ci;Username=promogest_owner;Password=owner_pass
        run: dotnet run --project src/PromoGest.Api/PromoGest.Api.csproj --configuration Release --no-build -- --migrate
      - name: Run integration tests with separate database identities
        env:
          PROMOGEST_TEST_PROVISION_DB_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres_password
          PROMOGEST_TEST_MIGRATE_DB_CONNECTION: Host=localhost;Port=5432;Database=promogest_ci;Username=promogest_owner;Password=owner_pass
          PROMOGEST_TEST_DB_CONNECTION: Host=localhost;Port=5432;Database=promogest_ci;Username=promogest_app;Password=app_pass
        run: dotnet test tests/PromoGest.IntegrationTests/PromoGest.IntegrationTests.csproj --configuration Release --no-build
      - name: Run full database, storage, and Data Protection restore drill
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: promogest_owner
          PGPROVISION_USER: postgres
          PROMOGEST_APP_USER: promogest_app
          PROMOGEST_DATA_PROTECTION_CERT_PASSWORD: Restore-CI-Pfx-Password-2026
          PGPASSFILE: ${{ runner.temp }}/promogest.pgpass
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'localhost:5432:*:postgres:postgres_password' \
            'localhost:5432:*:promogest_owner:owner_pass' \
            'localhost:5432:*:promogest_app:app_pass' > "$PGPASSFILE"
          chmod 600 "$PGPASSFILE"

          storage_root="$RUNNER_TEMP/promogest-storage"
          key_root="$RUNNER_TEMP/promogest-dpkeys"
          config_path="$RUNNER_TEMP/config/appsettings.json"
          mkdir -p "$storage_root/organization/2026/11" "$key_root" "$(dirname "$config_path")"
          printf 'PROMO GEST restore verification file\n' > "$storage_root/organization/2026/11/restore-probe.bin"
          printf '<key id="ci-restore-probe">test-only-key-material</key>\n' > "$key_root/key-ci-probe.xml"
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$RUNNER_TEMP/promogest-dp.key" \
            -out "$RUNNER_TEMP/promogest-dp.crt" \
            -days 2 -subj "/CN=PromoGest CI Data Protection"
          openssl pkcs12 -export -out "$key_root/protection.pfx" \
            -inkey "$RUNNER_TEMP/promogest-dp.key" \
            -in "$RUNNER_TEMP/promogest-dp.crt" \
            -passout env:PROMOGEST_DATA_PROTECTION_CERT_PASSWORD
          rm -f "$RUNNER_TEMP/promogest-dp.key" "$RUNNER_TEMP/promogest-dp.crt"
          printf '%s\n' '{"ConnectionStrings":{"DefaultConnection":"Host=localhost;Port=5432;Database=promogest_ci;Username=promogest_app;Password=app_pass"}}' > "$config_path"

          probe_file="$storage_root/organization/2026/11/restore-probe.bin"
          probe_hash="$(sha256sum "$probe_file" | awk '{print $1}')"
          probe_size="$(stat -c '%s' "$probe_file")"

          psql --host="$PGHOST" --port="$PGPORT" --username="$PGUSER" --dbname=promogest_ci \
            --set=ON_ERROR_STOP=1 --set=probe_hash="$probe_hash" --set=probe_size="$probe_size" <<'SQL'
          WITH probe_user AS (
              INSERT INTO users (
                  id, username, normalized_username, full_name, email, normalized_email, phone,
                  password_hash, is_system_administrator, is_active, preferred_language,
                  failed_login_attempts, lockout_end_utc, last_login_at_utc, security_stamp,
                  created_at_utc, updated_at_utc, concurrency_stamp
              )
              VALUES (
                  gen_random_uuid(), 'backup.restore.probe', 'BACKUP.RESTORE.PROBE',
                  'Backup Restore Probe', 'backup-restore-probe@example.invalid',
                  'BACKUP-RESTORE-PROBE@EXAMPLE.INVALID', NULL, 'test-only-password-hash',
                  FALSE, TRUE, 'ar', 0, NULL, NULL, gen_random_uuid(), now(), now(), gen_random_uuid()
              )
              RETURNING id
          )
          INSERT INTO stored_files (
              id, original_file_name, stored_relative_path, content_type, size_bytes,
              sha256_checksum, scope, project_id, uploaded_by_user_id,
              created_at_utc, updated_at_utc, concurrency_stamp
          )
          SELECT gen_random_uuid(), 'restore-probe.bin', 'organization/2026/11/restore-probe.bin',
                 'application/octet-stream', :'probe_size'::bigint, :'probe_hash',
                 'Organization', NULL, probe_user.id, now(), now(), gen_random_uuid()
          FROM probe_user;
          SQL

          echo "[Linux backup script] Creating a real protected backup bundle as root..."
          sudo install -d -o root -g root -m 0750 /etc/promogest
          sudo install -o root -g root -m 0600 "$PGPASSFILE" /etc/promogest/pgpass
          backup_root="$RUNNER_TEMP/promogest-backups"
          lock_mode_before="$(stat -c '%a' /run/lock)"
          sudo env \
            PGHOST="$PGHOST" PGPORT="$PGPORT" PGUSER="$PGUSER" \
            PGPASSFILE=/etc/promogest/pgpass \
            PROMOGEST_DB_NAME=promogest_ci \
            PROMOGEST_STORAGE_DIR="$storage_root" \
            PROMOGEST_DATA_PROTECTION_KEY_DIR="$key_root" \
            PROMOGEST_CONFIG_PATH="$config_path" \
            PROMOGEST_CADDYFILE_PATH="$GITHUB_WORKSPACE/deploy/linux/Caddyfile" \
            PROMOGEST_BACKUP_ROOT="$backup_root" \
            PROMOGEST_DATA_PROTECTION_CERT_PASSWORD="$PROMOGEST_DATA_PROTECTION_CERT_PASSWORD" \
            bash scripts/backup-promogest.sh
          bundle_dir="$(sudo find "$backup_root" -mindepth 1 -maxdepth 1 -type d -name 'promogest_backup_*' -print -quit)"
          test -n "$bundle_dir"
          for component in database.dump storage.tar.gz dataprotection-keys.tar.gz config-sanitized.tar.gz manifest.sha256; do
            sudo test -s "$bundle_dir/$component"
          done
          sudo bash -c 'cd "$1" && sha256sum -c manifest.sha256' _ "$bundle_dir"
          lock_mode_after="$(stat -c '%a' /run/lock)"
          if [[ "$lock_mode_after" != "$lock_mode_before" ]]; then
            echo "Backup script changed /run/lock permissions ($lock_mode_before -> $lock_mode_after)." >&2
            exit 1
          fi
          sudo env \
            PGHOST="$PGHOST" PGPORT="$PGPORT" PGUSER="$PGUSER" \
            PGPROVISION_USER=postgres PROMOGEST_APP_USER=promogest_app \
            PGPASSFILE=/etc/promogest/pgpass \
            PROMOGEST_DATA_PROTECTION_CERT_PASSWORD="$PROMOGEST_DATA_PROTECTION_CERT_PASSWORD" \
            bash scripts/verify-backup-restore.sh promogest_ci "" "" "" "$bundle_dir"

          echo "[Linux backup script] Verifying failed backups are cleaned and the service is restarted..."
          fake_systemd_dir="$RUNNER_TEMP/promogest-fake-systemctl"
          failed_backup_root="$RUNNER_TEMP/promogest-failed-backups"
          systemd_state="$RUNNER_TEMP/promogest-systemd-state"
          mkdir -p "$fake_systemd_dir"
          cat > "$fake_systemd_dir/systemctl" <<'SYSTEMCTL'
          #!/usr/bin/env bash
          set -euo pipefail
          case "${1:-}" in
            show) cat "$PROMOGEST_TEST_SYSTEMD_STATE" ;;
            stop) printf 'inactive\n' > "$PROMOGEST_TEST_SYSTEMD_STATE" ;;
            start) printf 'active\n' > "$PROMOGEST_TEST_SYSTEMD_STATE" ;;
            *) echo "Unexpected fake systemctl command: ${1:-}" >&2; exit 2 ;;
          esac
          SYSTEMCTL
          chmod 0755 "$fake_systemd_dir/systemctl"
          printf 'active\n' > "$systemd_state"
          if sudo env \
            PATH="$fake_systemd_dir:$PATH" \
            PGHOST=127.0.0.1 PGPORT=1 PGUSER="$PGUSER" \
            PGPASSFILE=/etc/promogest/pgpass \
            PROMOGEST_TEST_SYSTEMD_STATE="$systemd_state" \
            PROMOGEST_SERVICE_NAME=promogest-failure-probe.service \
            PROMOGEST_DB_NAME=promogest_ci \
            PROMOGEST_STORAGE_DIR="$storage_root" \
            PROMOGEST_DATA_PROTECTION_KEY_DIR="$key_root" \
            PROMOGEST_CONFIG_PATH="$config_path" \
            PROMOGEST_CADDYFILE_PATH="$GITHUB_WORKSPACE/deploy/linux/Caddyfile" \
            PROMOGEST_BACKUP_ROOT="$failed_backup_root" \
            PROMOGEST_DATA_PROTECTION_CERT_PASSWORD="$PROMOGEST_DATA_PROTECTION_CERT_PASSWORD" \
            bash scripts/backup-promogest.sh; then
            echo "Backup unexpectedly succeeded while PostgreSQL was unreachable." >&2
            exit 1
          fi
          test "$(cat "$systemd_state")" = "active"
          remaining_partial="$(sudo find "$failed_backup_root" -mindepth 1 -maxdepth 1 -type d -name 'promogest_backup_*' -print -quit)"
          test -z "$remaining_partial"

          echo "[Linux backup script] Verifying transitional systemd states are rejected..."
          transient_backup_root="$RUNNER_TEMP/promogest-transient-backups"
          printf 'activating\n' > "$systemd_state"
          if sudo env \
            PATH="$fake_systemd_dir:$PATH" \
            PGHOST="$PGHOST" PGPORT="$PGPORT" PGUSER="$PGUSER" \
            PGPASSFILE=/etc/promogest/pgpass \
            PROMOGEST_TEST_SYSTEMD_STATE="$systemd_state" \
            PROMOGEST_SERVICE_NAME=promogest-transient-probe.service \
            PROMOGEST_DB_NAME=promogest_ci \
            PROMOGEST_STORAGE_DIR="$storage_root" \
            PROMOGEST_DATA_PROTECTION_KEY_DIR="$key_root" \
            PROMOGEST_CONFIG_PATH="$config_path" \
            PROMOGEST_CADDYFILE_PATH="$GITHUB_WORKSPACE/deploy/linux/Caddyfile" \
            PROMOGEST_BACKUP_ROOT="$transient_backup_root" \
            PROMOGEST_DATA_PROTECTION_CERT_PASSWORD="$PROMOGEST_DATA_PROTECTION_CERT_PASSWORD" \
            bash scripts/backup-promogest.sh; then
            echo "Backup unexpectedly proceeded while the service was activating." >&2
            exit 1
          fi
          test "$(cat "$systemd_state")" = "activating"
          remaining_transient="$(sudo find "$transient_backup_root" -mindepth 1 -maxdepth 1 -type d -name 'promogest_backup_*' -print -quit)"
          test -z "$remaining_transient"
          sudo rm -rf -- "$failed_backup_root" "$transient_backup_root" "$fake_systemd_dir"
          rm -f -- "$systemd_state"
          echo "Verified failed-backup cleanup, service restart, and transitional-state rejection."

          echo "[Linux backup script] Verifying unsafe backup destinations are rejected..."
          if sudo env \
            PGHOST="$PGHOST" PGPORT="$PGPORT" PGUSER="$PGUSER" \
            PGPASSFILE=/etc/promogest/pgpass \
            PROMOGEST_DATA_PROTECTION_CERT_PASSWORD="$PROMOGEST_DATA_PROTECTION_CERT_PASSWORD" \
            PROMOGEST_DB_NAME=promogest_ci \
            PROMOGEST_STORAGE_DIR="$storage_root" \
            PROMOGEST_DATA_PROTECTION_KEY_DIR="$key_root" \
            PROMOGEST_CONFIG_PATH="$config_path" \
            PROMOGEST_CADDYFILE_PATH="$GITHUB_WORKSPACE/deploy/linux/Caddyfile" \
            PROMOGEST_BACKUP_ROOT="$storage_root/backup-under-storage" \
            bash scripts/backup-promogest.sh; then
            echo "Backup script accepted a destination nested inside document storage." >&2
            exit 1
          fi

          echo "[Linux backup script] Verifying shared system backup roots are rejected..."
          if sudo env \
            PGHOST="$PGHOST" PGPORT="$PGPORT" PGUSER="$PGUSER" \
            PGPASSFILE=/etc/promogest/pgpass \
            PROMOGEST_DATA_PROTECTION_CERT_PASSWORD="$PROMOGEST_DATA_PROTECTION_CERT_PASSWORD" \
            PROMOGEST_DB_NAME=promogest_ci \
            PROMOGEST_STORAGE_DIR="$storage_root" \
            PROMOGEST_DATA_PROTECTION_KEY_DIR="$key_root" \
            PROMOGEST_CONFIG_PATH="$config_path" \
            PROMOGEST_CADDYFILE_PATH="$GITHUB_WORKSPACE/deploy/linux/Caddyfile" \
            PROMOGEST_BACKUP_ROOT=/var/backups \
            bash scripts/backup-promogest.sh; then
            echo "Backup script accepted the shared /var/backups directory." >&2
            exit 1
          fi

          echo "[Linux backup script] Verifying ProtectHome paths are rejected only in systemd mode..."
          if sudo env \
            PGHOST="$PGHOST" PGPORT="$PGPORT" PGUSER="$PGUSER" \
            PGPASSFILE=/etc/promogest/pgpass \
            PROMOGEST_DATA_PROTECTION_CERT_PASSWORD="$PROMOGEST_DATA_PROTECTION_CERT_PASSWORD" \
            PROMOGEST_SYSTEMD_PROTECT_HOME=true \
            PROMOGEST_DB_NAME=promogest_ci \
            PROMOGEST_STORAGE_DIR="$storage_root" \
            PROMOGEST_DATA_PROTECTION_KEY_DIR="$key_root" \
            PROMOGEST_CONFIG_PATH="$config_path" \
            PROMOGEST_CADDYFILE_PATH="$GITHUB_WORKSPACE/deploy/linux/Caddyfile" \
            PROMOGEST_BACKUP_ROOT="$RUNNER_TEMP/protected-home-backup-probe" \
            bash scripts/backup-promogest.sh; then
            echo "Backup script accepted a protected-home destination in systemd mode." >&2
            exit 1
          fi

          echo "[Linux backup script] Verifying linked Data Protection roots are rejected..."
          key_root_link="$RUNNER_TEMP/promogest-dpkeys-link"
          ln -s "$key_root" "$key_root_link"
          if sudo env \
            PGHOST="$PGHOST" PGPORT="$PGPORT" PGUSER="$PGUSER" \
            PGPASSFILE=/etc/promogest/pgpass \
            PROMOGEST_DATA_PROTECTION_CERT_PASSWORD="$PROMOGEST_DATA_PROTECTION_CERT_PASSWORD" \
            PROMOGEST_DB_NAME=promogest_ci \
            PROMOGEST_STORAGE_DIR="$storage_root" \
            PROMOGEST_DATA_PROTECTION_KEY_DIR="$key_root_link" \
            PROMOGEST_CONFIG_PATH="$config_path" \
            PROMOGEST_CADDYFILE_PATH="$GITHUB_WORKSPACE/deploy/linux/Caddyfile" \
            PROMOGEST_BACKUP_ROOT="$RUNNER_TEMP/promogest-symlink-backup-probe" \
            bash scripts/backup-promogest.sh; then
            echo "Backup script accepted a symbolic-link Data Protection root." >&2
            exit 1
          fi

  windows-publish-and-powershell:
    name: Windows publish and PowerShell validation
    needs: frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: promogest-wwwroot
          path: src/PromoGest.Api/wwwroot
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Restore solution
        run: dotnet restore src/PromoGest.sln
      - name: Build solution
        run: dotnet build src/PromoGest.sln --configuration Release --no-restore
      - name: Verify Windows machine-scoped Data Protection key-ring recovery
        run: dotnet test tests/PromoGest.IntegrationTests/PromoGest.IntegrationTests.csproj --configuration Release --no-build --filter FullyQualifiedName~WindowsDpapiMachineScopeTests
      - name: Publish Windows x64 application
        run: dotnet publish src/PromoGest.Api/PromoGest.Api.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/win-x64
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path scripts, deploy -Recurse -Filter *.ps1
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error "$($file.FullName):$($_.Extent.StartLineNumber):$($_.Extent.StartColumnNumber): $($_.Message)"
              }
              exit 1
            }
            Write-Host "Validated syntax: $($file.FullName)"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipSource = Join-Path $env:RUNNER_TEMP "promogest-zip-smoke-source"
          $zipPath = Join-Path $env:RUNNER_TEMP "promogest-zip-smoke.zip"
          New-Item -ItemType Directory -Force -Path $zipSource | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $zipSource ".hidden-probe"), "hidden-file-included")
          [System.IO.File]::WriteAllText((Join-Path $zipSource "ordinary-probe.txt"), "ordinary-file-included")
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $zipSource,
            $zipPath,
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false
          )
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $entryNames = @($zip.Entries | ForEach-Object { $_.FullName })
            if ($entryNames -notcontains ".hidden-probe" -or $entryNames -notcontains "ordinary-probe.txt") {
              throw "Windows backup ZIP smoke test failed to include hidden and ordinary files."
            }
          }
          finally {
            $zip.Dispose()
          }
          Remove-Item -LiteralPath $zipPath, $zipSource -Recurse -Force
          Write-Host "Verified ZIP creation includes hidden and ordinary files."

          $lockPath = Join-Path $env:RUNNER_TEMP "promogest-lock-smoke.lock"
          $firstLock = [System.IO.File]::Open(
            $lockPath,
            [System.IO.FileMode]::OpenOrCreate,
            [System.IO.FileAccess]::ReadWrite,
            [System.IO.FileShare]::None
          )
          $secondLockAcquired = $false
          try {
            try {
              $secondLock = [System.IO.File]::Open(
                $lockPath,
                [System.IO.FileMode]::OpenOrCreate,
                [System.IO.FileAccess]::ReadWrite,
                [System.IO.FileShare]::None
              )
              $secondLockAcquired = $true
              $secondLock.Dispose()
            }
            catch [System.IO.IOException] {
              Write-Host "Verified a concurrent Windows backup lock is rejected."
            }
          }
          finally {
            $firstLock.Dispose()
          }
          if ($secondLockAcquired) {
            throw "Windows backup lock smoke test allowed a second concurrent lock."
          }
          $releasedLock = [System.IO.File]::Open(
            $lockPath,
            [System.IO.FileMode]::OpenOrCreate,
            [System.IO.FileAccess]::ReadWrite,
            [System.IO.FileShare]::None
          )
          $releasedLock.Dispose()
          Remove-Item -LiteralPath $lockPath -Force
          Write-Host "Verified the Windows backup lock is released after completion."

          $restoreProbeRoot = Join-Path $env:RUNNER_TEMP "promogest-restore-overlap-smoke"
          $probeBundle = Join-Path $restoreProbeRoot "bundle"
          New-Item -ItemType Directory -Force -Path $probeBundle | Out-Null
          foreach ($component in @("database.dump", "storage.zip", "dataprotection-keys.zip", "config-sanitized.zip", "manifest.sha256")) {
            [System.IO.File]::WriteAllText((Join-Path $probeBundle $component), "validation-probe")
          }
          $restoreScript = Join-Path (Get-Location).Path "scripts/restore-promogest.ps1"

          $junctionTarget = Join-Path $env:RUNNER_TEMP "promogest-backup-junction-target"
          $backupJunction = Join-Path $env:RUNNER_TEMP "promogest-backup-junction"
          New-Item -ItemType Directory -Force -Path $junctionTarget | Out-Null
          New-Item -ItemType Junction -Path $backupJunction -Target $junctionTarget | Out-Null
          try {
            $backupScriptBlocked = $false
            try {
              & .\scripts\backup-promogest.ps1 -BackupRoot (Join-Path $backupJunction "destination")
            }
            catch {
              $backupScriptBlocked = $_.Exception.Message -like "*junction or symbolic link*"
            }
            if (-not $backupScriptBlocked) {
              throw "Windows backup script did not reject a destination traversing a junction."
            }

            $installerBlocked = $false
            try {
              & .\deploy\windows\install-service.ps1 -BackupRoot (Join-Path $backupJunction "destination")
            }
            catch {
              $installerBlocked = $_.Exception.Message -like "*junction or symbolic link*"
            }
            if (-not $installerBlocked) {
              throw "Windows installer did not reject a backup destination traversing a junction."
            }

            $restoreReparseBlocked = $false
            try {
              & $restoreScript -BackupBundleDir $probeBundle -RestoreStorageDir (Join-Path $backupJunction "restore-storage") -RestoreDataProtectionDir (Join-Path $restoreProbeRoot "restore-keys") -RestoreConfigDir (Join-Path $restoreProbeRoot "restore-config")
            }
            catch {
              $restoreReparseBlocked = $_.Exception.Message -like "*junction or symbolic link*"
            }
            if (-not $restoreReparseBlocked) {
              throw "Windows restore script did not reject a destination traversing a junction."
            }
          }
          finally {
            Remove-Item -LiteralPath $backupJunction -Force
            Remove-Item -LiteralPath $junctionTarget -Recurse -Force
          }
          Write-Host "Verified backup, install, and restore scripts reject junction-based destinations."

          $overlapRejected = $false
          try {
            & $restoreScript -BackupBundleDir $probeBundle -RestoreStorageDir (Join-Path $restoreProbeRoot "overlap-output") -RestoreDataProtectionDir (Join-Path (Join-Path $restoreProbeRoot "overlap-output") "nested") -RestoreConfigDir (Join-Path $restoreProbeRoot "other-output")
          }
          catch {
            Write-Host "Restore overlap probe returned: $($_.Exception.Message)"
            $overlapRejected = $_.Exception.Message -like "*distinct and non-overlapping*"
          }
          if (-not $overlapRejected) {
            throw "The production restore script did not reject overlapping restore destinations."
          }

          $liveRootRejected = $false
          try {
            & $restoreScript -BackupBundleDir $probeBundle -ProtectedInstallRoot $restoreProbeRoot -RestoreStorageDir (Join-Path $restoreProbeRoot "live-storage-restore") -RestoreDataProtectionDir (Join-Path $env:RUNNER_TEMP "isolated-restore-keys") -RestoreConfigDir (Join-Path $env:RUNNER_TEMP "isolated-restore-config")
          }
          catch {
            Write-Host "Live installation root probe returned: $($_.Exception.Message)"
            $liveRootRejected = $_.Exception.Message -like "*outside the live installation root*"
          }
          if (-not $liveRootRejected) {
            throw "The production restore script did not reject an output directory inside the live installation root."
          }

          $databaseDumpProbe = Join-Path $probeBundle "database.dump"
          [System.IO.File]::WriteAllText($databaseDumpProbe, "not-a-real-dump")
          $storageArchiveProbe = Join-Path $probeBundle "storage.zip"
          $dpArchiveProbe = Join-Path $probeBundle "dataprotection-keys.zip"
          $configArchiveProbe = Join-Path $probeBundle "config-sanitized.zip"
          $maliciousArchive = [System.IO.Compression.ZipFile]::Open(
            $storageArchiveProbe,
            [System.IO.Compression.ZipArchiveMode]::Create
          )
          try {
            $maliciousEntry = $maliciousArchive.CreateEntry("../escape.txt")
            $maliciousWriter = [System.IO.StreamWriter]::new($maliciousEntry.Open())
            try { $maliciousWriter.Write("must-not-escape") }
            finally { $maliciousWriter.Dispose() }
          }
          finally {
            $maliciousArchive.Dispose()
          }
          foreach ($archivePath in @($dpArchiveProbe, $configArchiveProbe)) {
            $emptyArchive = [System.IO.Compression.ZipFile]::Open(
              $archivePath,
              [System.IO.Compression.ZipArchiveMode]::Create
            )
            $emptyArchive.Dispose()
          }
          $manifestFiles = @("database.dump", "storage.zip", "dataprotection-keys.zip", "config-sanitized.zip")
          $manifestLines = foreach ($name in $manifestFiles) {
            $fileHash = (Get-FileHash -LiteralPath (Join-Path $probeBundle $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$fileHash  $name"
          }
          [System.IO.File]::WriteAllLines(
            (Join-Path $probeBundle "manifest.sha256"),
            [string[]]$manifestLines,
            [System.Text.UTF8Encoding]::new($false)
          )
          $unsafeArchiveRejected = $false
          try {
            & $restoreScript -BackupBundleDir $probeBundle -TargetDatabase promogest_zip_traversal_probe -RestoreStorageDir (Join-Path $restoreProbeRoot "zip-storage") -RestoreDataProtectionDir (Join-Path $restoreProbeRoot "zip-keys") -RestoreConfigDir (Join-Path $restoreProbeRoot "zip-config")
          }
          catch {
            Write-Host "Unsafe ZIP probe returned: $($_.Exception.Message)"
            $unsafeArchiveRejected = $_.Exception.Message -like "*Unsafe ZIP entry path*"
          }
          if (-not $unsafeArchiveRejected) {
            throw "The production restore script did not reject a ZIP traversal entry before database access."
          }
          foreach ($outputPath in @("zip-storage", "zip-keys", "zip-config")) {
            if (Test-Path -LiteralPath (Join-Path $restoreProbeRoot $outputPath)) {
              throw "Unsafe ZIP was rejected too late; restore output was already created: $outputPath"
            }
          }

          Remove-Item -LiteralPath $restoreProbeRoot -Recurse -Force
          Write-Host "Verified the production restore script rejects overlapping destinations before database access."


