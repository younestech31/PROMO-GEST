name: Temporary EF customer model reconciliation

on:
  push:
    branches: [feat/project-customer-registry]

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, 'Generated EF customer model reconciliation') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install EF Core command-line tools
        run: dotnet tool install --global dotnet-ef --version 10.0.0

      - name: Restore solution
        run: dotnet restore src/PromoGest.sln

      - name: Scaffold snapshot reconciliation using the actual EF runtime model
        run: |
          dotnet ef migrations add CustomerModelSnapshotReconciliation \
            --project src/PromoGest.Infrastructure/PromoGest.Infrastructure.csproj \
            --startup-project src/PromoGest.Infrastructure/PromoGest.Infrastructure.csproj \
            --context AppDbContext \
            --output-dir Persistence/Migrations

      - name: Preserve the shared migration snapshot helper
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/PromoGest.Infrastructure/Persistence/Migrations/AppDbContextModelSnapshot.cs")
          source = path.read_text(encoding="utf-8")
          class_anchor = "    partial class AppDbContextModelSnapshot : ModelSnapshot\n    {"
          helper = """
                  internal static void BuildModelCore(ModelBuilder modelBuilder)
                  {
                      new AppDbContextModelSnapshot().BuildModel(modelBuilder);
                  }
          """
          if source.count(class_anchor) != 1:
              raise SystemExit("Unable to locate the model snapshot class exactly once.")
          if "internal static void BuildModelCore" not in source:
              source = source.replace(class_anchor, class_anchor + helper, 1)
              path.write_text(source, encoding="utf-8")
          PY

      - name: Build generated migration and snapshot
        run: dotnet build src/PromoGest.sln --configuration Release --no-restore

      - name: Verify no pending EF model changes remain
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project src/PromoGest.Infrastructure/PromoGest.Infrastructure.csproj \
            --startup-project src/PromoGest.Infrastructure/PromoGest.Infrastructure.csproj \
            --context AppDbContext

      - name: Commit the generated migration and authoritative model snapshot
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "EF reported pending changes but produced no files; failing for investigation."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PromoGest.Infrastructure/Persistence/Migrations
          git commit -m "Generated EF customer model reconciliation"
          git push origin "HEAD:${BRANCH_NAME}"
