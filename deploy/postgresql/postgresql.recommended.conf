# Recommended PostgreSQL 18 configuration snippet for PROMO GEST local server
# Target hardware baseline: 16 GB RAM, NVMe SSD, 10-40 LAN workstations

listen_addresses = '127.0.0.1'
port = 5432
max_connections = 100
shared_buffers = 2GB
effective_cache_size = 6GB
maintenance_work_mem = 256MB
work_mem = 16MB
wal_level = replica
synchronous_commit = on
full_page_writes = on
checkpoint_timeout = 10min
logging_collector = on
log_connections = on
log_disconnections = on
log_duration = off
log_line_prefix = '%m [%p] %q%u@%d '
ssl = off
